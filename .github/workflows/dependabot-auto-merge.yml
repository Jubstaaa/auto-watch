name: Dependabot auto-merge

on: pull_request

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
            # Only explicit patch and minor updates of packages merge on their own, once
            # the required check passes. Majors, unknown update types and GitHub Actions
            # wait for a human. A runtime dependency bump also changes dist/, which
            # Dependabot does not rebuild, so the dist check holds it for a human too.
            # Consumers pin release tags: merged updates reach them with the next release.
            - if: >-
                  (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
                   steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
                  steps.metadata.outputs.package-ecosystem != 'github_actions' &&
                  steps.metadata.outputs.package-ecosystem != 'docker'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
              run: gh pr merge --auto --merge "$PR_URL"
